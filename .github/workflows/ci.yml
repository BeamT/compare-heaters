name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Nothing internal in the public repo
        run: |
          node scripts/check-public.ts --all
          node scripts/check-public.ts --log
      - run: pnpm typecheck
      - run: pnpm test
